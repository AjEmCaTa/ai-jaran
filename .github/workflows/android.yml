name: Android aplikacija

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Ključ za potpis
        env:
          PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then echo "::warning::Nema tajne: pravim nepotpisan paket (samo provjera)."; exit 0; fi
            echo "::error::Nedostaje tajna ANDROID_SIGNING_PASSPHRASE (GitHub > Settings > Secrets and variables > Actions)"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sig"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/sig/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/signing/android-signing.enc -pass file:"$RUNNER_TEMP/sig/pass" | tar xz -C "$RUNNER_TEMP/sig"
          cp "$RUNNER_TEMP/sig/poslo-upload.jks" android/app/upload.jks
          echo "::add-mask::$(cat "$RUNNER_TEMP/sig/pw.txt")"
          echo "ANDROID_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/sig/pw.txt")" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/sig"

      - name: Izrada (.aab za Play i .apk za probu)
        working-directory: android
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Obriši ključ
        if: always()
        run: rm -f android/app/upload.jks

      - uses: actions/upload-artifact@v4
        with:
          name: poslo-one-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
